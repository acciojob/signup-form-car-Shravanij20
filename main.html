<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required placeholder="Name">
		<br>

		<label for="email">Email</label>
		<input type="Email" id="email" required placeholder="Email">
		<br>

		<label for="gender_m">Gender</label>
		<input type="Radio" id="gender_m" name="gender" required>Male
		<br>
	
		<input type="Radio" id="gender_f" name="gender" required>Female
		<br>
	
		<label for="cars">Car Brands:</label>
		<select id="cars" placeholder="--Please choose an option--" required>
		  
		  <option value="toyota">Toyota</option>
		  <option value="ford">Ford</option>
		  <option value="honda">Honda</option>
		  <option value="tesla">Tesla</option>
		</select>
		<br>
	
		<label for="age">Age</label>
		<input type="Number" id="age" required placeholder="Age">
		<br>
	
		<label for="dob">DOB</label>
		<input type="Date" id="dob" required placeholder="Name">
		<br>
	
		<label for="tel">Phone Number</label>
		<input type="Tel" id="tel" placeholder="xxx-xxx-xxxx">
		<br>
	
		<label for="password">Password</label>
		<input type="Password" id="password" required placeholder="Password">
		<br>
	
		<label for="tos">I agree to the TOS</label>
		<input type="Checkbox" id="tos" required>
		<br>

		<button type="submit" value="Submit">

	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
